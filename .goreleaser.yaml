version: 2
project_name: blucli

before:
  hooks:
    - go test ./...

builds:
  - id: blu
    main: ./cmd/blu/main.go
    binary: blu
    env:
      - CGO_ENABLED=0
      - MACOSX_DEPLOYMENT_TARGET=12.0
    hooks:
      post: python3 scripts/check_macos_target.py {{ .Path }} {{ .Os }}
    ldflags:
      - -s -w -X main.version={{.Version}}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64

archives:
  - id: default
    ids:
      - blu
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  disable: true
